services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.8-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    ports:
      - "8080:80"

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        BACKEND_APP_VERSION: local
    command: bash worker.sh
    environment:
      ENVIRONMENT: DEV
      DATABASE_URL: 'postgresql://aurora:AuroraAdminPanel321@postgres:5432/aurora'
      DDNS_INTERVAL_SECONDS: 6000000
      TRAFFIC_INTERVAL_SECONDS: 10000000
    user: 1000:1000
    volumes:
      - /home/lei/.ssh/id_ed25519:/app/ansible/env/ssh_key
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        BACKEND_APP_VERSION: local
    command: bash -c "alembic upgrade heads && python app/main.py"
    tty: true
    environment:
      PYTHONPATH: .
      ENVIRONMENT: DEV
      DATABASE_URL: 'postgresql://aurora:AuroraAdminPanel321@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:AuroraAdminPanel321@postgres:5432/aurora'
      SECRET_KEY: 'd7Wn3VRWMWPqpM5rqsdRAvW$$2Y7&MTwqnEFZrxA!tNDd&p9F#quNp*SsKzd&AWSLap!NkvW7DPsHktcJPA&cw@bZ$$hxpprDdGKk*h53tL47dDH2epM6JaqD6mfju4&bz'
      VIRTUAL_HOST: aurora.localhost
      VIRTUAL_PORT: "8888"
      VIRTUAL_PATH: "/api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: 1000:1000
    volumes:
      - /home/lei/.ssh/id_ed25519:/app/ansible/env/ssh_key
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/graphql"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    stdin_open: true
    command: bash -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - REACT_APP_VERSION=local
      - VITE_APP_VERSION=local
      - VIRTUAL_HOST=aurora.localhost
      - VIRTUAL_PORT=5173
      - VIRTUAL_PATH=/
    user: 1000:1000
    volumes:
      - ./frontend:/app

  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: timescale/timescaledb:latest-pg13
    restart: always
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: AuroraAdminPanel321
      POSTGRES_DB: aurora
      TIMESCALEDB_TELEMETRY: 'off'
    command: ["-c", "shared_preload_libraries=timescaledb"]
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aurora"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      VIRTUAL_HOST: db.localhost
      VIRTUAL_PORT: "8080"

volumes:
  db-data:
